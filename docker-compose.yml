# Three Recall app processes behind nginx. Session is cookie + CRDB — no sticky sessions.
# From repo root:
#   docker compose up --build
# Open http://localhost:3000
# Health of one node: docker compose exec app-a wget -qO- http://127.0.0.1:3000/api/health

services:
  app-a: &app
    build: ./recall-agent
    env_file:
      - ./recall-agent/.env.local
    environment:
      NODE_ENV: production
      INSTANCE_ID: a
      DATABASE_POOL_MAX: "16"
      CHAT_MAX_INFLIGHT: "24"
      CHAT_SLOT_WAIT_MS: "15000"
    restart: unless-stopped

  app-b:
    <<: *app
    environment:
      NODE_ENV: production
      INSTANCE_ID: b
      DATABASE_POOL_MAX: "16"
      CHAT_MAX_INFLIGHT: "24"
      CHAT_SLOT_WAIT_MS: "15000"

  app-c:
    <<: *app
    environment:
      NODE_ENV: production
      INSTANCE_ID: c
      DATABASE_POOL_MAX: "16"
      CHAT_MAX_INFLIGHT: "24"
      CHAT_SLOT_WAIT_MS: "15000"

  lb:
    image: nginx:1.27-alpine
    ports:
      - "3000:80"
    volumes:
      - ./recall-agent/deploy/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app-a
      - app-b
      - app-c
    restart: unless-stopped
