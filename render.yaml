# Render Blueprint — New → Blueprint, pick witold-andelie/recall-agent.
# Fill DATABASE_URL and AWS keys before the first healthy deploy.
# Google OAuth is optional; set APP_URL to the https://*.onrender.com URL after the first deploy.

services:
  - type: web
    name: recall-agent
    runtime: node
    plan: free
    rootDir: recall-agent
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: AI_PROVIDER
        value: bedrock
      - key: AWS_REGION
        value: us-east-1
      - key: DATABASE_SSL
        value: "true"
      - key: SESSION_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: APP_URL
        sync: false
